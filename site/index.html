<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:">
<title>Artifex</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="stage"></div>
<img id="poster" alt="" hidden>
<main>
<header class="intro"><div class="card">
<h1>Artifex</h1>
<p>A film you scroll: every frame is drawn live, in your browser, from a seed and a playhead.</p>
</div></header>
<!-- shots -->
<div id="spacer"></div>
</main>
<div class="wall" aria-hidden="true" hidden></div><div class="wall" aria-hidden="true" hidden></div>
<div id="bar">
<label id="boxcontrol" hidden>Box width <input id="box" type="range" step="10"></label>
<button id="listen" type="button" aria-pressed="false" hidden>Listen</button>
<button id="play" type="button" aria-pressed="false">Play as film</button>
<button id="reroll" type="button">Re-roll seed</button>
<button id="copy" type="button">Copy link</button>
<button id="recipe" type="button">Copy recipe</button>
<button id="savepng" type="button">Save picture</button>
<button id="savefilm" type="button">Save film</button>
<button id="install" type="button">Copy install</button>
<span id="status" role="status"></span>
</div>
<!-- data -->
<script src="core.js"></script>
<script src="stage.js"></script>
</body>
</html>
