name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    name: Mutations (${{ matrix.shard }}/6)
    # Started by hand only: a full run takes hours of runner time across its shards.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Each shard runs the suite once as its control, then a sixth of the mutations one after another.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The shard count also appears in the job name and the run step.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run mutation checks
        # Through npm, which sets npm_execpath for tests that run npm themselves.
        run: npm run negative -- --shard ${{ matrix.shard }}/6

  check:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject tracked ignored files
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const paths = execFileSync('git', ['ls-files', '-ci', '--exclude-standard'], { encoding: 'utf8' }).trim(); if (paths) { console.error('Ignored files are tracked:\n' + paths); process.exit(1); }"
      - name: Run lint and tests
        run: npm run check
      - name: Build the standalone page
        run: npm run page
      # Builds out/site/ and tests the site's builder and stage helpers; deploys nothing.
      - name: Build the showcase site
        run: npm run site
      - name: Run the site checks
        run: npm run site:check
