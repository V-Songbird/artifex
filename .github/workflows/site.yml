name: Site

# Started by hand only: nothing here runs on a push. It checks and builds the
# showcase site and deploys nothing yet; the site will be hosted on
# Cloudflare, not GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  browser:
    name: Check the site in Edge
    # The hosted Windows image has Microsoft Edge, which the site check drives.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build the showcase site
        run: npm run site
      # Its frame budgets are set for a reference machine with a GPU; a hosted
      # runner draws in software, so a budget over its limit here does not stop
      # the run. Every other finding is in the log to read before deploying.
      - name: Check the built site in Edge
        continue-on-error: true
        run: node tools/check-site.js

  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build the showcase site
        run: npm run site
      - name: Run the site checks
        run: npm run site:check
